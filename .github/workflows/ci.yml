name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mise.toml の go バージョンをそのまま使う
      - uses: jdx/mise-action@v2

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt が必要なファイル:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # .golangci.yml は v2 形式のため action / lint 本体とも v2 系を使う
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.2

      - name: go test
        run: go test -race ./...

      # Lambda 向けのクロスコンパイルが通ることを確認する
      - name: build
        run: make build
