name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mise.toml の go バージョンをそのまま使う
      - uses: jdx/mise-action@v2

      # 差分が出たら make format の実行漏れ
      - name: format
        run: |
          make format
          git diff --exit-code

      # 配布バイナリは Go 1.25 ビルドで 1.26 のコードを解析できないため、
      # go run でこの環境の Go (1.26.5) からビルドして実行する
      - name: golangci-lint
        run: make lint

      - name: go test
        run: make test

      # Lambda 向けのクロスコンパイルが通ることを確認する
      - name: build
        run: make build
