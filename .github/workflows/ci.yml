name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mise.toml の go バージョンをそのまま使う
      - uses: jdx/mise-action@v2

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt が必要なファイル:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # 配布バイナリは Go 1.25 ビルドで 1.26 のコードを解析できないため、
      # go run でこの環境の Go (1.26.5) からビルドして実行する
      - name: golangci-lint
        run: make lint

      - name: go test
        run: go test -race ./...

      # Lambda 向けのクロスコンパイルが通ることを確認する
      - name: build
        run: make build
