name: Deploy

# release/* へのマージで、インフラ適用とコード更新を順に実行する
on:
  push:
    branches:
      - release/dev
      - release/prod

permissions:
  contents: read
  id-token: write

# 同じ環境への同時実行を防ぐ
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # release/dev → dev, release/prod → prod
      - name: resolve env
        id: env
        run: echo "name=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/kusuri-api-poc-${{ steps.env.outputs.name }}-terraform-apply
          aws-region: ap-northeast-1

      - uses: jdx/mise-action@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      # インフラの変更を適用する。差分がなければ数秒で終わる
      - name: terraform apply
        run: |
          terraform -chdir=terraform/env/${{ steps.env.outputs.name }} init
          terraform -chdir=terraform/env/${{ steps.env.outputs.name }} apply -auto-approve

      - name: build package
        run: make zip

      # バージョンを発行 → 疎通確認 → エイリアス切り替え
      - name: deploy
        run: scripts/deploy.sh ${{ steps.env.outputs.name }}

      # デプロイの成否を SNS(alerts) 経由で Slack へ通知する (Chatbot のカスタム通知形式)
      - name: notify deploy result
        if: always()
        env:
          DEPLOY_STATUS: ${{ job.status }}
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ENV_NAME: ${{ steps.env.outputs.name }}
        run: |
          if [ "$DEPLOY_STATUS" = "success" ]; then
            icon="✅"
          else
            icon="❌"
          fi
          topic_arn="arn:aws:sns:ap-northeast-1:${ACCOUNT_ID}:kusuri-api-poc-${ENV_NAME}-alerts"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          message=$(printf '{"version":"1.0","source":"custom","content":{"title":"%s deploy %s: %s","description":"commit %s by %s | %s"}}' "$icon" "$ENV_NAME" "$DEPLOY_STATUS" "$GITHUB_SHA" "$GITHUB_ACTOR" "$run_url")
          aws sns publish --topic-arn "$topic_arn" --message "$message"
