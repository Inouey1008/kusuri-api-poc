name: Deploy

# release/* へのマージで、インフラ適用とコード更新を順に実行する
on:
  push:
    branches:
      - release/dev
      - release/prod

permissions:
  contents: read
  id-token: write

# 同じ環境への同時実行を防ぐ
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # release/dev → dev, release/prod → prod
      - name: resolve env
        id: env
        run: echo "name=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/kusuri-api-poc-${{ steps.env.outputs.name }}-terraform-apply
          aws-region: ap-northeast-1

      - uses: jdx/mise-action@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      # インフラの変更を適用する。差分がなければ数秒で終わる
      - name: terraform apply
        run: |
          terraform -chdir=terraform/env/${{ steps.env.outputs.name }} init
          terraform -chdir=terraform/env/${{ steps.env.outputs.name }} apply -auto-approve

      - name: build package
        run: make zip

      # バージョンを発行 → 疎通確認 → エイリアス切り替え
      - name: deploy
        run: scripts/deploy.sh ${{ steps.env.outputs.name }}

      # デプロイの成否を Slack Incoming Webhook へ通知する
      # SLACK_WEBHOOK_URL (GH secret) が未設定なら通知をスキップする
      - name: notify deploy result
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DEPLOY_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL 未設定のため通知をスキップ"
            exit 0
          fi
          if [ "$DEPLOY_STATUS" = "success" ]; then
            icon="✅"
            color="#2eb886"
            mention=""
          else
            icon="❌"
            color="#a30200"
            mention="<!channel> "
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -n \
            --arg color "$color" --arg icon "$icon" --arg repo "$REPO" \
            --arg branch "$BRANCH" --arg st "$DEPLOY_STATUS" --arg url "$run_url" \
            --arg mention "$mention" '
            { text: ($mention + $icon + " Deploy " + $st + " — " + $repo + " @ " + $branch),
              attachments: [ { color: $color, blocks: [
              { type: "section", text: { type: "mrkdwn",
                text: ($mention + $icon + " *<" + $url + "|Deploy " + $st + ">*") } },
              { type: "section", fields: [
                { type: "mrkdwn", text: ("*Repository:*\n" + $repo) },
                { type: "mrkdwn", text: ("*Branch:*\n`" + $branch + "`") },
                { type: "mrkdwn", text: ("*Status:*\n" + $st) }
              ] } ] } ] }')
          curl -sSf -X POST -H 'Content-type: application/json' --data "$payload" "$WEBHOOK_URL"
