name: Deploy

# release/* へのマージで、インフラ適用とコード更新を順に実行する
on:
  push:
    branches:
      - release/dev
      - release/prod

permissions:
  contents: read
  id-token: write

# 同じ環境への同時実行を防ぐ
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # release/dev → dev, release/prod → prod
      - name: resolve env
        id: env
        run: echo "name=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/kusuri-api-poc-${{ steps.env.outputs.name }}-terraform-apply
          aws-region: ap-northeast-1

      - uses: jdx/mise-action@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      # インフラの変更を適用する。差分がなければ数秒で終わる
      - name: terraform apply
        run: |
          terraform -chdir=terraform/env/${{ steps.env.outputs.name }} init
          terraform -chdir=terraform/env/${{ steps.env.outputs.name }} apply -auto-approve

      - name: build package
        run: make zip

      # バージョンを発行 → 疎通確認 → エイリアス切り替え
      - name: deploy
        run: scripts/deploy.sh ${{ steps.env.outputs.name }}
