openapi: 3.1.0

info:
  title: kusuri-api-poc
  version: 0.1.0
  description: |
    医薬品マスタの検索 API (PoC)。

    AWS Lambda 上で動作し、API Gateway (HTTP API) を経由して公開する。
    データは同梱の SQLite (読み取り専用) を参照する。

    認証は未実装。流量は API Gateway 側で制限しており、
    超過分は Lambda に到達せず 429 が返る。

    未登録のパスは `NOT_FOUND` の Error 形式で 404 を返す。

    ```json
    { "code": "NOT_FOUND", "error": "Not Found" }
    ```

    この仕様書自体は `/openapi.yaml` で配信し、`/docs` でブラウザ表示できる。
    どちらも API の操作ではないため、ここには記載しない。

servers:
  - url: http://localhost:8080
    description: ローカル (make run)
  - url: https://{apiId}.execute-api.{region}.amazonaws.com
    description: API Gateway (HTTP API)
    variables:
      apiId:
        default: xxxxxxxxxx
      region:
        default: ap-northeast-1

paths:
  /health:
    get:
      summary: ヘルスチェック
      description: |
        デプロイ後の疎通確認に使う。DB 接続は起動時に確認済みのため、ここでは見ない。

        実行環境を温存するため、5 分ごとに定期的に呼ばれる。
      operationId: checkHealth
      security: [] # 認証不要
      responses:
        "200":
          description: 正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /drugs:
    get:
      summary: 医薬品検索
      description: |
        薬品名の部分一致で検索する。照合は正規化済みの名前に対して行うため、
        `jg` のような小文字・カナ抜きの入力でも一致する。

        最大 20 件を返す。ページングは未対応。
      operationId: searchDrugs
      security: [] # 認証不要
      parameters:
        - name: q
          in: query
          required: false
          description: 検索クエリ。省略時は全件 (最大 20 件) を返す。
          schema:
            type: string
            maxLength: 100
          examples:
            keyword:
              summary: 薬品名の一部
              value: エゼチミブ
            empty:
              summary: 省略 (全件)
              value: ""
      responses:
        "200":
          description: 検索成功。該当が 0 件でも 200 を返す。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
              examples:
                found:
                  summary: 2 件ヒット
                  value:
                    total: 2
                    items:
                      - yjCode: "2189018F1043"
                        name: エゼチミブ錠10mg「JG」
                      - yjCode: "2189018F1094"
                        name: エゼチミブ錠10mg「YD」
                empty:
                  summary: 0 件 (items は null ではなく空配列)
                  value:
                    total: 0
                    items: []
        "400":
          description: 入力値が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: VALIDATION_FAILED
                error: 入力内容に誤りがあります
                details:
                  - field: q
                    message: must be at most 100 characters
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  responses:
    MethodNotAllowed:
      description: 登録されていないメソッド
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: METHOD_NOT_ALLOWED
            error: Method Not Allowed

    TooManyRequests:
      description: |
        流量の上限を超えた。API Gateway が返すため、本文は Error 形式ではない。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GatewayError"
          example:
            message: Too Many Requests

    InternalError:
      description: サーバー内部エラー
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INTERNAL_ERROR
            error: サーバー内部でエラーが発生しました

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Drug:
      type: object
      required: [yjCode, name]
      properties:
        yjCode:
          type: string
          description: YJ コード (12 桁英数字)
          example: "2189018F1043"
        name:
          type: string
          description: 薬品名
          example: エゼチミブ錠10mg「JG」

    SearchResponse:
      type: object
      required: [total, items]
      properties:
        total:
          type: integer
          description: items の件数。総ヒット数ではない (最大 20)。
          example: 2
        items:
          type: array
          description: 該当が 0 件でも null にはならず空配列を返す。
          items:
            $ref: "#/components/schemas/Drug"

    Error:
      type: object
      required: [code, error]
      description: |
        アプリが返すエラー形式。

        `code` は言語非依存の識別子で、クライアントの分岐にはこちらを使う。
        `error` は表示用の文言であり、変更される可能性がある。
      properties:
        code:
          type: string
          description: エラー種別の識別子
          enum:
            - VALIDATION_FAILED
            - INTERNAL_ERROR
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
        error:
          type: string
          description: 人間向けのエラーメッセージ
          example: 入力内容に誤りがあります
        details:
          type: array
          description: バリデーション違反の詳細。VALIDATION_FAILED のときのみ含まれる。
          items:
            $ref: "#/components/schemas/FieldError"

    GatewayError:
      type: object
      required: [message]
      description: |
        API Gateway が生成するエラー形式。アプリに到達しないため Error とは異なる。

        HTTP API では本文をカスタマイズできないため、クライアントは
        ステータスコードで分岐し、本文の形式に依存しないこと。
      properties:
        message:
          type: string
          example: Too Many Requests

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: 違反したフィールド名 (リクエストのパラメータ名と一致)
          example: q
        message:
          type: string
          description: 違反内容 (英語)
          example: must be at most 100 characters
